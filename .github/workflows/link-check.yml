name: Tool directory link check

on:
  schedule:
    - cron: "23 4 * * 1" # weekly, Monday 04:23 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:links
      - name: Commit link-check results
        run: |
          git config user.name "ai-economics-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/curated/link-check.json
          git diff --cached --quiet && exit 0
          git commit -m "data: weekly tool link check"
          git pull --rebase origin "${GITHUB_REF_NAME}" && git push
